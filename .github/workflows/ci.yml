name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore LumaKnob.slnx

      - name: Build
        run: dotnet build LumaKnob.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LumaKnob.slnx --configuration Release --no-build --no-restore

      - name: Verify formatting and analyzers
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format LumaKnob.slnx --verify-no-changes --no-restore
