name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - run: dotnet restore LumaKnob.slnx
      - run: dotnet build LumaKnob.slnx --configuration Release --no-restore
      - run: dotnet test LumaKnob.slnx --configuration Release --no-build --no-restore

      - name: Build LumaKnob.exe
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\publish-win-x64.ps1 -Version $version

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash "artifacts\LumaKnob.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          **[Download LumaKnob.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LumaKnob.exe) and open it.**

          Windows x64 · no installer · no extraction · no separate .NET runtime

          This is an unsigned alpha. Press **Ctrl+Alt+Home** to restore all displays.

          <details><summary>Verification</summary>

          Built on GitHub's Windows runner after all 45 tests passed.

          SHA-256: ``$hash``

          </details>
          "@ | Set-Content "artifacts\release-notes.md" -Encoding utf8

          gh release create "${{ github.ref_name }}" `
            "artifacts\LumaKnob.exe" `
            --verify-tag `
            --draft `
            --prerelease `
            --title "LumaKnob ${{ github.ref_name }}" `
            --notes-file "artifacts\release-notes.md"
