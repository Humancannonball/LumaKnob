name: Draft Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore LumaKnob.slnx

      - name: Build
        run: dotnet build LumaKnob.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LumaKnob.slnx --configuration Release --no-build --no-restore

      - name: Package win-x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\publish-win-x64.ps1 -Version $version

      - name: Write checksum and release notes
        shell: pwsh
        run: |
          $archive = "artifacts\LumaKnob-win-x64.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LumaKnob-win-x64.zip" | Set-Content "artifacts\SHA256SUMS.txt" -Encoding ascii
          @"
          This is a supervised LumaKnob prerelease for Windows x64 device testing.

          The portable executable is not yet production-signed. Windows may show a SmartScreen warning. Do not disable Windows security controls; verify SHA256SUMS.txt and use the emergency restore path described in PROJECT.md.
          "@ | Set-Content "artifacts\release-notes.md" -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaKnob-${{ github.ref_name }}-win-x64
          path: |
            artifacts/LumaKnob-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts\LumaKnob-win-x64.zip" `
            "artifacts\SHA256SUMS.txt" `
            --verify-tag `
            --draft `
            --prerelease `
            --title "LumaKnob ${{ github.ref_name }}" `
            --notes-file "artifacts\release-notes.md"
