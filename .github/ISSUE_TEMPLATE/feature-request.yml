name: Feature request
description: Propose a focused improvement to LumaKnob.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem before the proposed interface or implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how it should work with multiple displays, recovery, and the compact tray UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Project principles
      options:
        - label: This can work without administrator rights, a service, telemetry, or a kernel driver.
          required: true
