name: Device report
description: Share a monitor or GPU result.
title: "[Device]: "
labels: [device-report]
body:
  - type: input
    id: setup
    attributes:
      label: Version and setup
      placeholder: LumaKnob version; Windows; GPU/driver; monitor model; connection
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend shown
      options: [WMI + shade, DDC/CI + shade, Shade only, Discovery failed]
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What worked or failed?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant COPY LOG lines
      description: Remove usernames, EDID serial numbers, and unrelated data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: Ctrl+Alt+Home and normal Exit restored the displays.
          required: true
        - label: This report contains no username or EDID serial number.
          required: true
