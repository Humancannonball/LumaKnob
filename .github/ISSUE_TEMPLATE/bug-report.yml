name: Bug report
description: Report a repeatable problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LumaKnob and Windows version
      placeholder: v0.1.0-alpha.2; Windows 11 build
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and short reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant COPY LOG lines
      description: Remove usernames, serial numbers, and unrelated data.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: Recovery works, or this bug does not involve display changes.
          required: true
